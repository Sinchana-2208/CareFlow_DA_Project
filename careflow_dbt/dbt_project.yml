name: 'careflow_dbt'
version: '1.0.0'
config-version: 2
profile: 'careflow'

model-paths: ['models']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
analysis-paths: ['analyses']
snapshot-paths: ['snapshots']
clean-targets: ['target', 'dbt_packages']

vars:
  careflow_source_dataset: 'careflow_raw'

models:
  careflow_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
